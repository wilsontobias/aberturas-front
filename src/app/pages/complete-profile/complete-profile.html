<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Completá tus datos</h1>
        <p class="text-secondary small mb-3">Los necesitamos para coordinar la entrega de tus pedidos.</p>

        @if (error()) {
          <div class="alert alert-danger" data-testid="profile-error">{{ error() }}</div>
        }

        <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
          <div class="row g-3">
            <div class="col-md-6">
              <label for="first_name" class="form-label">Nombre</label>
              <input id="first_name" type="text" class="form-control" formControlName="first_name" [class.is-invalid]="errorOf('first_name')" />
              <div class="invalid-feedback">{{ errorOf('first_name') }}</div>
            </div>
            <div class="col-md-6">
              <label for="last_name" class="form-label">Apellido</label>
              <input id="last_name" type="text" class="form-control" formControlName="last_name" [class.is-invalid]="errorOf('last_name')" />
              <div class="invalid-feedback">{{ errorOf('last_name') }}</div>
            </div>

            <div class="col-md-6">
              <label for="province" class="form-label">Provincia</label>
              <select id="province" class="form-select" formControlName="province_id" [class.is-invalid]="errorOf('province_id')">
                <option [ngValue]="null">Elegí una provincia</option>
                @for (province of provinces(); track province.id) {
                  <option [ngValue]="province.id">{{ province.name }}</option>
                }
              </select>
              <div class="invalid-feedback">{{ errorOf('province_id') }}</div>
            </div>

            <div class="col-md-6">
              <label for="locality" class="form-label">Localidad</label>
              <select id="locality" class="form-select" formControlName="locality_id" [class.is-invalid]="errorOf('locality_id')">
                <option [ngValue]="null">Elegí una localidad</option>
                @for (locality of localities(); track locality.id) {
                  <option [ngValue]="locality.id">{{ locality.name }}</option>
                }
              </select>
              <div class="invalid-feedback">{{ errorOf('locality_id') }}</div>
            </div>

            <div class="col-md-6">
              <label for="phone_1" class="form-label">Teléfono 1</label>
              <input id="phone_1" type="text" class="form-control" formControlName="phone_1" [class.is-invalid]="errorOf('phone_1')" />
              <div class="invalid-feedback">{{ errorOf('phone_1') }}</div>
            </div>
            <div class="col-md-6">
              <label for="phone_2" class="form-label">Teléfono 2</label>
              <input id="phone_2" type="text" class="form-control" formControlName="phone_2" [class.is-invalid]="errorOf('phone_2')" />
              <div class="invalid-feedback">{{ errorOf('phone_2') }}</div>
            </div>
          </div>

          <button type="submit" class="btn btn-dark w-100 mt-4" [disabled]="sending()">
            {{ sending() ? 'Guardando…' : 'Guardar y continuar' }}
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
