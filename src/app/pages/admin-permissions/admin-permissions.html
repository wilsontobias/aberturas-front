<a routerLink="/admin/users" class="small">&larr; Usuarios</a>

@if (loading()) {
  <p class="text-secondary mt-3">Cargando…</p>
} @else if (error() && !userName()) {
  <div class="alert alert-danger mt-3" data-testid="perm-load-error">{{ error() }}</div>
} @else {
  <div class="card shadow-sm mt-3" style="max-width: 560px">
    <div class="card-body p-4">
      <h1 class="h4 mb-1">Permisos</h1>
      <p class="text-secondary">{{ userName() }} · {{ typeText(userType()) }}</p>

      @if (error()) {
        <div class="alert alert-danger" data-testid="perm-error">{{ error() }}</div>
      }
      @if (ok()) {
        <div class="alert alert-success" data-testid="perm-ok">{{ ok() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="save()">
        @for (key of keys; track key) {
          <div class="form-check form-switch mb-2">
            <input class="form-check-input" type="checkbox" role="switch" [id]="key" [formControlName]="key" [attr.data-testid]="'perm-' + key" />
            <label class="form-check-label" [for]="key">{{ labels[key] }}</label>
          </div>
        }

        <button type="submit" class="btn btn-dark mt-3" [disabled]="saving()" data-testid="perm-save">
          {{ saving() ? 'Guardando…' : 'Guardar permisos' }}
        </button>
      </form>
    </div>
  </div>
}
